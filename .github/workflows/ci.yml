name: Проверки MCP

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Проверяемая ветка или тег"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  transport:
    name: Транспорт — ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Проверить транспорт без движка
        run: python -X utf8 -m unittest discover -s tests -v

  windows-engine:
    name: Установка пакета и настоящий Lua
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Подготовить изолированное окружение
        shell: pwsh
        run: |
          python -m venv .venv-test
          ./.venv-test/Scripts/python -m pip install setuptools==80.9.0
          ./.venv-test/Scripts/python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          ./.venv-test/Scripts/python -m pip install --no-deps (Get-Item dist/*.whl).FullName
      - name: Загрузить закреплённый движок
        run: python -X utf8 run.py setup --destination .engine
      - name: Проверить пакет вне рабочего каталога
        shell: pwsh
        run: |
          $env:POB_DIR = (Resolve-Path .engine).Path
          $installedPython = (Resolve-Path .venv-test/Scripts/python.exe).Path
          Push-Location $env:RUNNER_TEMP
          & $installedPython -m pob_poe2_mcp doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Проверить API и MCP с настоящим Lua
        shell: pwsh
        run: |
          $env:POB_DIR = (Resolve-Path .engine).Path
          python -X utf8 -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 examples/build_fireball.py
      - name: Собрать и проверить ZIP без системного Python и Git
        shell: pwsh
        run: |
          python -X utf8 tools/build_portable.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath dist/pob-poe2-mcp-windows-x64.zip -DestinationPath dist/portable-check
          python -X utf8 tools/check_portable.py dist/portable-check/pob-poe2-mcp --pob-dir .engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pob-poe2-mcp-packages
          path: |
            dist/*.whl
            dist/pob-poe2-mcp-windows-x64.zip
