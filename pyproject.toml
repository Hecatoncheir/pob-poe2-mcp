[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pob-poe2-mcp"
version = "0.5.0"
description = "Локальный MCP-сервер Path of Building для Path of Exile 2"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [{name = "Hecatoncheir"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/Hecatoncheir/pob-poe2-mcp"
Issues = "https://github.com/Hecatoncheir/pob-poe2-mcp/issues"
Source = "https://github.com/Hecatoncheir/pob-poe2-mcp"

[project.scripts]
pob-poe2-mcp = "pob_poe2_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["pob_poe2_mcp*"]

[tool.setuptools.package-data]
pob_poe2_mcp = ["lua/*.lua", "data/*.json"]
